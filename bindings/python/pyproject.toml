[project]
name = "kaleidoswap_sdk"
version = "0.4.1"
description = "Boltz Swap library"
readme = "README.md"
requires-python = ">=3.11"
# pydantic backs the generated RLN models (rln_types.py) that the uniffi
# custom-type converters hydrate at the FFI boundary.
dependencies = ["pydantic>=2"]

[project.urls]
Homepage = "https://boltz.exchange"
Repository = "https://github.com/SatoshiPortal/boltz-rust"
Documentation = "https://docs.boltz.exchange"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["libkaleidoswap_sdk.so", "libkaleidoswap_sdk.dylib", "kaleidoswap_sdk.py", "rln_types.py"]
ignore-vcs = true

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]
