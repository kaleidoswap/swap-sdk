[project]
name = "kaleidoswap_sdk"
version = "0.4.1"
description = "KaleidoSwap SDK — atomic swaps (Boltz protocol) between Bitcoin, Lightning, and Liquid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://kaleidoswap.com"
Repository = "https://github.com/kaleidoswap/kaleidoswap-sdk"
Documentation = "https://docs.kaleidoswap.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["libkaleidoswap_sdk.so", "libkaleidoswap_sdk.dylib", "kaleidoswap_sdk.py"]
ignore-vcs = true

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]
