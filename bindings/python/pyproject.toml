[project]
name = "kaleidorg_swap_sdk"
version = "0.4.1"
description = "Boltz Swap library"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://boltz.exchange"
Repository = "https://github.com/SatoshiPortal/boltz-rust"
Documentation = "https://docs.boltz.exchange"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["libkaleidorg_swap_sdk.so", "kaleidorg_swap_sdk.py"]
ignore-vcs = true

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]
