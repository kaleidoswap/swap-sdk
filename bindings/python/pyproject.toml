[project]
name = "kaleidoswap_sdk"
version = "0.1.0"
description = "KaleidoSwap SDK — atomic swaps (Boltz protocol) + RGB Lightning Node client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE-PYTHON"]
authors = [{ name = "KaleidoSwap" }]
keywords = ["bitcoin", "lightning", "liquid", "rgb", "atomic-swaps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]
# pydantic backs the generated RLN models that the uniffi
# custom-type converters hydrate at the FFI boundary.
dependencies = ["pydantic>=2"]

[project.urls]
Homepage = "https://kaleidoswap.com"
Repository = "https://github.com/kaleidoswap/kaleidoswap-sdk"
Documentation = "https://docs.kaleidoswap.com"
Issues = "https://github.com/kaleidoswap/kaleidoswap-sdk/issues"

[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[tool.maturin]
bindings = "uniffi"
manifest-path = "../Cargo.toml"
strip = true
# Wheel commands pass --locked. Do not set it globally: Maturin prunes the
# unrelated WASM workspace member from an sdist, so Cargo must remove that
# member's unused entries from the bundled workspace lockfile during install.

[tool.uv]
# Development tools must not build/install the native project merely to run.
package = false

[tool.ruff]
extend-exclude = ["kaleidoswap_sdk/_generated_uniffi.py"]

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]==0.71.0",
    "maturin==1.14.1",
    "ruff>=0.12.7",
]
