[project]
name = "kaleidoswap_sdk"
version = "0.1.0"
description = "KaleidoSwap SDK — atomic swaps (Boltz protocol) + RGB Lightning Node client"
readme = "README.md"
requires-python = ">=3.11"
# pydantic backs the generated RLN models (rln_types.py) that the uniffi
# custom-type converters hydrate at the FFI boundary.
dependencies = ["pydantic>=2"]

[project.urls]
Homepage = "https://kaleidoswap.com"
Repository = "https://github.com/kaleidoswap/kaleidoswap-sdk"
Documentation = "https://docs.kaleidoswap.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["libkaleidoswap_sdk.so", "libkaleidoswap_sdk.dylib", "kaleidoswap_sdk.py", "rln_types.py"]
ignore-vcs = true

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]
