[package]
name = "kaleidorg-swap-sdk"
description = "KaleidoSwap swap SDK — client-side Boltz-protocol atomic swaps across Bitcoin, Lightning, and Liquid"
# Fork of boltz-rust (SatoshiPortal) — the swap engine is their work (MIT);
# see README for provenance and acknowledgments. Upstream ships no LICENSE
# file, so its MIT grant and authorship live only in its Cargo.toml; the
# original authors are kept here and in LICENSE so the notice travels with
# every published artifact.
authors = [
    "KaleidoSwap <info@kaleidoswap.com>",
    "i5hi <ishi@satoshiportal.com>",
    "Rajarshi Maitra <raj@bitshala.org>",
]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kaleidoswap/swap-sdk"
homepage = "https://kaleidoswap.com"
readme = "README.md"
include = [
    "/src/**",
    "/bindings/uniffi-workspace-shim.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/CHANGELOG.upstream.md",
    "/LICENSE",
]

[lib]
name = "kaleidorg_swap_sdk"
path = "src/lib.rs"
doctest = false
crate-type = ["lib"]

[[bin]]
# Maturin 1.14 discovers UniFFI generators through workspace metadata, but
# invokes the selected name with bindings/Cargo.toml. This matching root target
# makes discovery deterministic; Cargo then runs the real bindings-owned bin.
name = "uniffi-bindgen"
path = "bindings/uniffi-workspace-shim.rs"

[workspace]
members = [
    "bindings",
    "bindings-wasm",
    "macros",
]

[workspace.dependencies]
bitcoin = { version = "0.32.2", features = ["rand", "base64", "rand-std"] }
elements = { version = "0.26.2", features = ["serde", "base64"] }
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
async-trait = "0.1.86"
tokio = { version = "1.43.0", features = ["time"] }
serial_test = "3.2.0"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bitcoin = { workspace = true }

# Used for musig API not available in secp included in bitcoin/elements
# TODO: remove once bitcoin included version contains musig
#
# A git rev and not a crates.io version: every `0.32.0-beta.*` was yanked on
# 2026-08-28, superseded by the stable 0.33 line. Cargo will keep using a yanked
# version that a `Cargo.lock` already pins, so this repo's own builds went on
# working — but any resolution that starts without that lock cannot see the
# version at all, which is a downstream consumer adding this SDK, and is what
# the "Build as wasm dependency" job reproduces. A `=0.32.0-beta.2` requirement
# does not help: yanked versions are excluded from a fresh resolution however
# exact the requirement. A git source is not subject to the yank.
#
# `rev`, not `tag`: this is a cryptography dependency and a tag can be moved,
# which is a class of surprise the yank has just demonstrated the cost of. The
# rev below is the commit tagged `secp256k1-0.32.0-beta.2` — the same version
# the lock pinned before this change, so no call site moves.
#
# This is a stopgap, not the destination. The real fix is 0.33.x, whose MuSig2
# nonce API differs (`SessionSecretRand::assume_unique_per_nonce_gen` takes a
# second argument, and `KeyAggCache::nonce_gen` changed shape) — a migration
# through the cooperative-signing path that wants its own review, not a rider
# on an unrelated branch.
secp256k1_musig = { package = "secp256k1", git = "https://github.com/rust-bitcoin/rust-secp256k1", rev = "6e5c556e566d6ca1954daa1d8592efac70e75d06" }

elements = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
bip39 = "2.0.0"
lightning-invoice = "0.34.0"
url = "2.5.0"
log = "^0.4"
env_logger = "0.11.8"
hex = "0.4"
lnurl-rs = { version = "0.9.0", default-features = false, features = ["async", "async-https"], optional = true }
reqwest = { version = "0.12.12" , default-features = false, features = ["json", "rustls-tls"] }
macros = { version = "1.0.0", path = "macros", package = "kaleidorg-swap-sdk-macros" }
futures-util = "0.3.31"
tokio-tungstenite-wasm = { version = "0.6.0", features = ["rustls-tls-webpki-roots"], optional = true }
bip85_extended = "1.1.0"
lightning = "0.2.2"
zeroize = "1.9.0"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
electrum-client = { version = "0.25.0", default-features = false, features = ["use-rustls-ring", "proxy"], optional = true }
rustls = { version = "0.23.32", default-features = false, features = ["ring"], optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3.77"
web-sys = "0.3.77"
wasm-bindgen-futures = "0.4.50"
gloo-timers = { version = "0.3.0", features = ["futures"] }



[dev-dependencies]
serial_test = { workspace = true }
tokio = { version = "1.43.0", features = ["rt", "macros"] }
anyhow = "1.0.100"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
bitcoind = { version = "0.36.0", features = ["25_0"] }
elementsd = { version = "0.11.0", features = ["22_1_1"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3.50"
wasm-bindgen = "0.2.100"
futures = "0.3.31"

[features]
default = ["esplora"]
lnurl = ["dep:lnurl-rs"]
esplora = []
electrum = ["dep:electrum-client"]
# Feature to enable tests that require previous initialization of a regtest environment
regtest = []
ws = ["tokio/sync", "tokio/rt", "tokio/macros", "dep:tokio-tungstenite-wasm", "dep:rustls"]
