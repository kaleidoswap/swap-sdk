[package]
name = "rgb-sdk-regtest"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

# rgb-lib and test-node clients stay outside the SDK dependency graph.
[workspace]

[dependencies]
kaleidoswap = { path = "../.." }
rgb-lib = { git = "https://github.com/kaleidoswap/rgb-lib", rev = "d085a5e6e20339c196cee950d2ae99bb5843c5a4", default-features = false, features = ["esplora"] }
ldk-server-client = { git = "https://github.com/kaleidoswap/kaleidoswap-maker-rs", rev = "823d56774baa8c8c45c13ba0802b7c0e5bb3ee6d" }
maker-connector-grpc = { git = "https://github.com/kaleidoswap/kaleidoswap-maker-rs", rev = "823d56774baa8c8c45c13ba0802b7c0e5bb3ee6d" }
# rgb-lib's pre-release invoice dependency otherwise selects incompatible stable consensus.
rgb-consensus = "=0.11.2-rc.2"
bitcoin = { version = "0.32", features = ["base64", "rand-std"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
