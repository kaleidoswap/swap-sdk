name: mirror sync

# Runs only in the private mirror, kaleidoswap/swap-sdk-private. It keeps the
# mirror's trunk and release tags identical to the public repository's, so a
# security branch cut from the last release tag starts from exactly what users
# run. The mirror never has commits of its own on trunk: security work lives on
# `security/X.Y.Z` branches. Nothing here rewrites a ref, so a mirror trunk
# that has diverged, or a tag that points somewhere else, fails this job
# instead of being overwritten.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: mirror-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Fast-forward trunk and copy release tags from the public repository
    if: ${{ github.repository == 'kaleidoswap/swap-sdk-private' }}
    runs-on: ubuntu-24.04
    # Holds the App key. No reviewers, and deployments limited to trunk, which
    # is where a schedule runs.
    environment: mirror-sync
    timeout-minutes: 15
    steps:
      # GITHUB_TOKEN cannot push commits that change workflow files, and public
      # trunk changes them; the App token can.
      - name: Mint a token for the mirror
        id: mirror-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SECURITY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_RELEASE_APP_PRIVATE_KEY }}
          owner: kaleidoswap
          repositories: swap-sdk-private
          permission-contents: write
          permission-workflows: write
      - name: Fetch public trunk and release tags
        run: |
          git init --bare mirror.git
          git -C mirror.git fetch --no-tags https://github.com/kaleidoswap/swap-sdk.git \
            "refs/heads/trunk:refs/heads/trunk" \
            "refs/tags/v*:refs/tags/v*"
      - name: Push them to the mirror without rewriting anything
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          mirror="https://github.com/${GITHUB_REPOSITORY}.git"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}"
          git -C mirror.git -c "${header}" push "${mirror}" "refs/heads/trunk:refs/heads/trunk"
          git -C mirror.git -c "${header}" push "${mirror}" "refs/tags/v*:refs/tags/v*"
