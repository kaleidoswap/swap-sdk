name: package

on:
  push:
    branches:
      - trunk
  pull_request:

permissions:
  contents: read

env:
  CARGO_TYPIFY_VERSION: "0.7.0"
  MATURIN_VERSION: "1.14.1"
  NODE_VERSION: "22.23.1"
  PYTHON_VERSION: "3.11.9"
  RUST_VERSION: "1.88.0"
  UV_VERSION: "0.11.16"
  WASM_PACK_VERSION: "0.14.0"

jobs:
  generated-artifacts:
    name: Generated artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: bindings/python/uv.lock
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: typescript-sdk/package-lock.json
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
      - name: Install pinned cargo-typify
        run: cargo install cargo-typify --version "${CARGO_TYPIFY_VERSION}" --locked
      - name: Verify generated sources
        run: make check-generated

  python-wheel:
    name: Python wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            builder: manylinux
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            builder: manylinux
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            runner: macos-15-intel
            builder: host
            target: x86_64-apple-darwin
          - name: macos-aarch64
            runner: macos-15
            builder: host
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-2025
            builder: host
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: bindings/python/uv.lock
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Build manylinux wheel
        if: matrix.builder == 'manylinux'
        working-directory: bindings
        run: make build-python-manylinux
      - name: Build host wheel
        if: matrix.builder == 'host'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --locked --compatibility pypi --out dist
          maturin-version: v${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.target }}
          working-directory: bindings/python
      - name: Inspect wheel contents and platform tag
        run: >-
          python bindings/python/scripts/inspect_artifacts.py
          --wheel-only bindings/python/dist
      - name: Install wheel in a clean environment
        run: >-
          python bindings/python/scripts/smoke_artifact.py
          wheel --dist bindings/python/dist
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: python-wheel-${{ matrix.name }}
          path: bindings/python/dist/*.whl

  python-sdist:
    name: Python sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: bindings/python/uv.lock
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Build source distribution
        working-directory: bindings
        run: make build-python-sdist
      - name: Inspect source distribution
        working-directory: bindings
        run: make inspect-python-sdist
      - name: Rebuild and install source distribution
        working-directory: bindings
        run: make smoke-python-sdist
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: python-sdist
          path: bindings/python/dist/*.tar.gz

  typescript-package:
    name: TypeScript package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: typescript-sdk/package-lock.json
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked
      - name: Install locked TypeScript dependencies
        working-directory: typescript-sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build fresh WASM bindings
        run: make wasm-pack-build
      - name: Typecheck
        working-directory: typescript-sdk
        run: npm run typecheck
      - name: Lint
        working-directory: typescript-sdk
        run: npm run lint
      - name: Check formatting
        working-directory: typescript-sdk
        run: npm run format:check
      - name: Test
        working-directory: typescript-sdk
        run: npm test
      - name: Build
        working-directory: typescript-sdk
        run: npm run build
      - name: Pack and install in a clean consumer
        working-directory: typescript-sdk
        run: npm run smoke:package
      - name: Audit production dependencies
        working-directory: typescript-sdk
        run: npm audit --omit=dev
