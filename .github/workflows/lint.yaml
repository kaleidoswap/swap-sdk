on:
  push:
    branches:
      - trunk
  pull_request:

name: lint

jobs:
  fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set default toolchain
        run: rustup default nightly
      # A concrete version avoids setup-uv's extra GitHub "latest release"
      # API lookup, which can fail before any lint command runs.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: Set profile
        run: rustup set profile minimal
      - name: Add rustfmt
        run: rustup component add rustfmt
      - name: Add clippy
        run: rustup component add clippy
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Update toolchain
        run: rustup update
      - name: Check fmt
        run: cargo fmt --all -- --check
      - name: Validate public SDK versions
        run: make validate-versions
      - name: Clippy
        run: make cargo-clippy
      - name: Clippy wasm
        run: make wasm-clippy
      - name: Check python
        working-directory: bindings
        run: make check-python
