name: Maker schema drift

# An owner-triggered signal, separate from required SDK PR checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maker-schema-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - name: Check live maker schema
        env:
          GH_TOKEN: ${{ secrets.MAKER_SCHEMA_READ_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Configure read-only maker Contents access in MAKER_SCHEMA_READ_TOKEN"; exit 1; }
          uv run scripts/update_maker_swap_schema.py --check
