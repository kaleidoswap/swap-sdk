name: security publish source

# Gate 2 of a security release. Runs only in the private mirror,
# kaleidoswap/swap-sdk-private, on a `source/vX.Y.Z` tag that an administrator
# pushes on the same commit as `vX.Y.Z` once security-release.yaml has
# published and verified the packages. It publishes nothing new: it takes the
# bundle that run sealed, uploads the sdist, pushes the release commits and tag
# to the public repository and creates its GitHub release, where release.yaml
# verifies everything again. docs/releasing.md ("Security releases") is the
# runbook.
#
# The `source/` prefix keeps this tag out of every other workflow: `v*` does
# not match it, and mirror-sync.yaml copies only `v*` tags.

on:
  push:
    tags:
      - "source/v*"

concurrency:
  group: security-publish-source-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLIC_REPOSITORY: kaleidoswap/swap-sdk

jobs:
  # Gate 2 may only follow a gate 1 that finished: the release tag exists, this
  # tag is on its commit, and the security-release run for it succeeded. That
  # run's sealed bundle is what gets published, never a rebuild.
  source-mode:
    name: Find the verified security release for this tag
    if: ${{ github.repository == 'kaleidoswap/swap-sdk-private' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      run_id: ${{ steps.release.outputs.run_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Match the release tag and its verified run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#source/}"
          version="${tag#v}"
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not source/vX.Y.Z." >&2
            exit 1
          fi
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          release_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if [ "${commit}" != "${release_commit}" ]; then
            echo "${GITHUB_REF_NAME} is on ${commit}, but ${tag} is on ${release_commit}." >&2
            exit 1
          fi
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/security-release.yaml/runs?branch=${tag}&event=push&status=success" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${commit}\")][0].id // empty")"
          if [ -z "${run_id}" ]; then
            echo "No successful security-release run for ${tag} at ${commit}; publish and verify the packages first." >&2
            exit 1
          fi
          {
            echo "commit=${commit}"
            echo "run_id=${run_id}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "${tag}: publishing the source sealed by run ${run_id}"

  # From here on everything about this version is public. The environment hands
  # out the credentials only to a run on a `source/v*` tag.
  security-publish-source:
    name: Publish the source (gate 2)
    needs: source-mode
    runs-on: ubuntu-24.04
    environment: security-source
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    steps:
      # Full history: the commits behind the tag are what gets pushed.
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the bundle gate 1 sealed
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ needs.source-mode.outputs.tag }}
          path: release-artifacts
          run-id: ${{ needs.source-mode.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Re-verify the sealed bundle bytes before publishing
        working-directory: release-artifacts
        run: sha256sum --check --strict SHA256SUMS
      - name: Verify the sealed bundle against its manifest, checksums, and SBOM
        run: >-
          python3 scripts/verify_release_bundle.py release-artifacts
          --version "${{ needs.source-mode.outputs.version }}"
          --tag "${{ needs.source-mode.outputs.tag }}"
          --commit "${{ needs.source-mode.outputs.commit }}"
      - name: Mint a token for the public repository
        id: public-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SECURITY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_RELEASE_APP_PRIVATE_KEY }}
          owner: kaleidoswap
          repositories: swap-sdk
          permission-contents: write
          permission-workflows: write
      - name: Refuse to replace an existing public release
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          RELEASE_TAG: ${{ needs.source-mode.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${PUBLIC_REPOSITORY}" >/dev/null 2>&1; then
            echo "${PUBLIC_REPOSITORY} already has a release for ${RELEASE_TAG}." >&2
            exit 1
          fi
      - name: Select the exact validated source distribution
        if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
        run: |
          mkdir python-sdist
          cp release-artifacts/*.tar.gz python-sdist/
      # attestations stays false for the reason publish-pypi in release.yaml
      # gives.
      - name: Publish the source distribution to PyPI
        if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          attestations: false
          packages-dir: python-sdist
          password: ${{ secrets.PYPI_TOKEN }}
      # The exact commits the bundle was built from, so the manifest's commit is
      # the one the public repository now shows. They land on a
      # `release/X.Y.Z` branch, as a patch release does, and reach trunk
      # through the usual merge pull request. No --force: an existing branch or
      # tag of the same name stops the push.
      - name: Push the release commits and tag to the public repository
        env:
          COMMIT: ${{ needs.source-mode.outputs.commit }}
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          RELEASE_TAG: ${{ needs.source-mode.outputs.tag }}
          VERSION: ${{ needs.source-mode.outputs.version }}
        run: |
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --atomic "https://github.com/${PUBLIC_REPOSITORY}.git" \
            "${COMMIT}:refs/heads/release/${VERSION}" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
      - name: Extract finalized changelog notes
        run: >-
          python3 scripts/release_notes.py
          "${{ needs.source-mode.outputs.version }}" > release-notes.md
      - name: Publish the public GitHub release from the sealed bundle
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          RELEASE_TAG: ${{ needs.source-mode.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            release-artifacts/* \
            --repo "${PUBLIC_REPOSITORY}" \
            --title "KaleidoSwap SDK ${RELEASE_TAG}" \
            --verify-tag \
            --latest \
            --notes-file release-notes.md
