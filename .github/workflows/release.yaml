name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TYPIFY_VERSION: "0.7.0"
  MATURIN_VERSION: "1.14.1"
  NODE_VERSION: "22.23.1"
  NPM_PUBLISH_ENABLED: "false"
  PYPI_PUBLISH_ENABLED: "false"
  PYTHON_VERSION: "3.11.9"
  RUST_VERSION: "1.88.0"
  UV_VERSION: "0.11.16"
  WASM_PACK_VERSION: "0.14.0"

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch protected release base
        run: git fetch --no-tags origin trunk:refs/remotes/origin/trunk
      - name: Validate tag, version, and source reachability
        id: release
        run: |
          python3 scripts/validate_release_ref.py \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" origin/trunk
          echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - name: Verify registry availability and disabled publishers
        run: >-
          python3 scripts/check_registry_availability.py
          "${GITHUB_REF_NAME#v}"

  python-wheel:
    name: Release Python wheel (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            builder: manylinux
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            builder: manylinux
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            runner: macos-15-intel
            builder: host
            target: x86_64-apple-darwin
          - name: macos-aarch64
            runner: macos-15
            builder: host
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-2025
            builder: host
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: bindings/python/uv.lock
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Build manylinux wheel
        if: matrix.builder == 'manylinux'
        working-directory: bindings
        run: make build-python-manylinux
      - name: Build host wheel
        if: matrix.builder == 'host'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --locked --compatibility pypi --out dist
          maturin-version: v${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.target }}
          working-directory: bindings/python
      - name: Inspect wheel contents and platform tag
        run: >-
          python bindings/python/scripts/inspect_artifacts.py
          --wheel-only bindings/python/dist
      - name: Install exact wheel in a clean environment
        run: >-
          python bindings/python/scripts/smoke_artifact.py
          wheel --dist bindings/python/dist
      - name: Upload exact wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-build-python-wheel-${{ matrix.name }}-${{ github.run_attempt }}
          path: bindings/python/dist/*.whl
          retention-days: 7

  python-sdist:
    name: Release Python sdist
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: bindings/python/uv.lock
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Build source distribution
        working-directory: bindings
        run: make build-python-sdist
      - name: Inspect source distribution
        working-directory: bindings
        run: make inspect-python-sdist
      - name: Rebuild and install exact source distribution
        working-directory: bindings
        run: make smoke-python-sdist
      - name: Upload exact source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-build-python-sdist-${{ github.run_attempt }}
          path: bindings/python/dist/*.tar.gz
          retention-days: 7

  typescript-package:
    name: Release npm package
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: typescript-sdk/package-lock.json
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked
      - name: Install locked TypeScript dependencies
        working-directory: typescript-sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build fresh WASM bindings
        run: make wasm-pack-build
      - name: Validate TypeScript package
        working-directory: typescript-sdk
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm audit --omit=dev
      - name: Build exact npm tarball
        working-directory: typescript-sdk
        run: |
          mkdir release-dist
          npm pack --json --pack-destination release-dist
      - name: Install exact npm tarball in a clean consumer
        working-directory: typescript-sdk
        run: node scripts/smoke-package.mjs release-dist/*.tgz
      - name: Upload exact npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-build-npm-package-${{ github.run_attempt }}
          path: typescript-sdk/release-dist/*.tgz
          retention-days: 7

  release-ready:
    name: Release-ready artifact gate
    needs:
      - preflight
      - python-wheel
      - python-sdist
      - typescript-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: bindings/python/uv.lock
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download every exact build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          merge-multiple: true
          path: release-artifacts
          pattern: release-build-*-${{ github.run_attempt }}
      - name: Inspect Python archives
        run: python3 bindings/python/scripts/inspect_artifacts.py release-artifacts
      - name: Validate inventory and create SHA256SUMS and release.spdx.json
        run: >-
          python3 scripts/assemble_release.py release-artifacts
          --version "${{ needs.preflight.outputs.version }}"
          --tag "${GITHUB_REF_NAME}"
          --commit "${GITHUB_SHA}"
      - name: Clean-install exact Linux wheel
        run: |
          mkdir wheel-smoke
          cp release-artifacts/*manylinux*_x86_64.whl wheel-smoke/
          python3 bindings/python/scripts/smoke_artifact.py wheel --dist wheel-smoke
      - name: Rebuild and clean-install exact source distribution
        run: |
          mkdir sdist-smoke
          cp release-artifacts/*.tar.gz sdist-smoke/
          python3 bindings/python/scripts/smoke_artifact.py sdist --dist sdist-smoke
      - name: Clean-install exact npm tarball
        working-directory: typescript-sdk
        run: node scripts/smoke-package.mjs ../release-artifacts/*.tgz
      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-bundle-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release-artifacts/
          retention-days: 30

  registry-publish-complete:
    name: Registry publication gate (disabled in Phase 3)
    needs: release-ready
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm registry publishers remain disabled
        run: |
          test "${NPM_PUBLISH_ENABLED}" = "false"
          test "${PYPI_PUBLISH_ENABLED}" = "false"
          echo "No registry publisher is enabled in Phase 3."

  stage-github-release:
    name: Stage draft GitHub release
    needs: registry-publish-complete
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release-artifacts
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A GitHub release already exists for ${GITHUB_REF_NAME}; refusing to replace its assets." >&2
            exit 1
          fi
      - name: Create draft GitHub release from validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-artifacts/* \
            --draft \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KaleidoSwap SDK ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes "Validated release candidate. Registry publishing is disabled pending Phase 4 trusted-publisher configuration."
