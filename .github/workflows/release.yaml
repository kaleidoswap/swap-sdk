name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.1"
  NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED || 'false' }}
  NPM_PUBLISH_VERSION: "11.5.1"
  PYPI_PUBLISH_ENABLED: "false"
  TEST_PYPI_PUBLISH_ENABLED: ${{ vars.TEST_PYPI_PUBLISH_ENABLED || 'false' }}

jobs:
  release-ready:
    name: Build and validate exact release bundle
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yaml
    with:
      failure_case: none
      rehearsal: false
      release_tag: ${{ github.ref_name }}

  publish-npm:
    name: Publish exact npm tarball with OIDC
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    needs: release-ready
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Set up Node without a package cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install the pinned OIDC-capable npm CLI
        run: >-
          npm install --global npm@${NPM_PUBLISH_VERSION}
          --ignore-scripts --no-audit --no-fund
      - name: Verify npm trusted-publishing prerequisites
        run: |
          test "$(npm --version)" = "${NPM_PUBLISH_VERSION}"
          test -z "${NODE_AUTH_TOKEN:-}"
      - name: Download validated release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ needs.release-ready.outputs.release_id }}-${{ github.run_attempt }}
          path: release-artifacts
      - name: Publish the exact validated npm tarball
        run: npm publish release-artifacts/*.tgz --access public

  publish-testpypi:
    name: Publish exact Python artifacts to TestPyPI with OIDC
    if: ${{ vars.TEST_PYPI_PUBLISH_ENABLED == 'true' }}
    needs: release-ready
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ needs.release-ready.outputs.release_id }}-${{ github.run_attempt }}
          path: release-artifacts
      - name: Select the exact validated Python artifacts
        run: |
          mkdir python-release-artifacts
          cp release-artifacts/*.whl python-release-artifacts/
          cp release-artifacts/*.tar.gz python-release-artifacts/
      - name: Publish to TestPyPI with attestations
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          attestations: true
          packages-dir: python-release-artifacts
          repository-url: https://test.pypi.org/legacy/

  registry-publish-complete:
    name: Registry publication completion gate
    if: ${{ always() }}
    needs:
      - release-ready
      - publish-npm
      - publish-testpypi
    runs-on: ubuntu-24.04
    env:
      NPM_RESULT: ${{ needs.publish-npm.result }}
      RELEASE_READY_RESULT: ${{ needs.release-ready.result }}
      TEST_PYPI_RESULT: ${{ needs.publish-testpypi.result }}
    steps:
      - name: Require every enabled registry to succeed
        run: |
          test "${RELEASE_READY_RESULT}" = "success"

          if [ "${NPM_PUBLISH_ENABLED}" = "true" ]; then
            test "${NPM_RESULT}" = "success"
          else
            test "${NPM_RESULT}" = "skipped"
          fi

          if [ "${TEST_PYPI_PUBLISH_ENABLED}" = "true" ]; then
            test "${TEST_PYPI_RESULT}" = "success"
          else
            test "${TEST_PYPI_RESULT}" = "skipped"
          fi

          test "${PYPI_PUBLISH_ENABLED}" = "false"

  stage-github-release:
    name: Stage draft GitHub release
    needs:
      - release-ready
      - registry-publish-complete
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ needs.release-ready.outputs.release_id }}-${{ github.run_attempt }}
          path: release-artifacts
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-ready.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A GitHub release already exists for ${RELEASE_TAG}; refusing to replace its assets." >&2
            exit 1
          fi
      - name: Create draft GitHub release from validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-ready.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            release-artifacts/* \
            --draft \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KaleidoSwap SDK ${RELEASE_TAG}" \
            --verify-tag \
            --notes "Validated release candidate. Every enabled registry publish completed through the protected OIDC release boundary."
