name: security release

# Runs only in the private mirror, kaleidoswap/swap-sdk-private. The public
# repository carries this file so the mirror can sync it, and every job is
# skipped there. docs/releasing.md ("Security releases") is the runbook.
#
# A security release ships its packages before its source, in two steps that
# are each an administrator's tag push. The mirror is on GitHub Team, which has
# no required reviewers for a private repository's environments, so the second
# person signs off earlier: the fix and its release commit reach the
# `security/X.Y.Z` branch only through a pull request someone else approved,
# and only administrators can create the tags that publish.
#
# This workflow is gate 1, started by the `vX.Y.Z` tag:
#
#   1. security-build builds and seals the bundle with the same read-only graph
#      a public release uses;
#   2. security-publish-packages (environment security-packages) publishes the
#      native archives to the binaries-only host, the Python wheels and both
#      npm packages;
#   3. security-verify-packages proves the registries serve the sealed bytes.
#
# Gate 2 is security-publish-source.yaml, started by a `source/vX.Y.Z` tag on
# the same commit. Pushed straight after this run passes, packages and source
# go out together; pushed later, the source stays private for an embargo while
# the fixed packages are already installable.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: security-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.1"
  NPM_PUBLISH_VERSION: "11.5.1"
  ARTIFACTS_REPOSITORY: kaleidoswap/swap-sdk-artifacts

jobs:
  # The mirror receives every public tag through its sync, and those must not
  # start anything. Only a tag whose version has a `security/X.Y.Z` branch here
  # and is not on npm yet is a security release.
  security-mode:
    name: Decide whether this tag is a security release
    if: ${{ github.repository == 'kaleidoswap/swap-sdk-private' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base: ${{ steps.mode.outputs.base }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Look for the security branch and the registry version
        id: mode
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not vX.Y.Z." >&2
            exit 1
          fi
          base="security/${version}"
          if ! git ls-remote --exit-code --heads origin "${base}" >/dev/null; then
            mode=skip
            echo "No ${base} branch: a tag synced from the public repository."
          else
            state="$(python3 scripts/release_mode.py "${version}")"
            case "${state}" in
              unpublished) mode=release ;;
              published)
                mode=skip
                echo "${version} is already on npm."
                ;;
              *)
                echo "Unexpected registry state: ${state}" >&2
                exit 1
                ;;
            esac
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "${GITHUB_REF_NAME}: ${mode}"

  security-build:
    name: Build and validate exact release bundle
    needs: security-mode
    if: ${{ needs.security-mode.outputs.mode == 'release' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yaml
    with:
      failure_case: none
      rehearsal: false
      release_tag: ${{ github.ref_name }}
      release_base: ${{ needs.security-mode.outputs.base }}

  # Gate 1. One job publishes everything a consumer installs, in the order that
  # keeps every install working: the native archives first, because the React
  # Native package's postinstall downloads them. Its environment hands out the
  # registry credentials only to a run on a `v*` tag.
  security-publish-packages:
    name: Publish the packages (gate 1)
    needs: security-build
    runs-on: ubuntu-24.04
    environment: security-packages
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Set up Node without a package cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install the pinned npm CLI
        run: >-
          npm install --global npm@${NPM_PUBLISH_VERSION}
          --ignore-scripts --no-audit --no-fund
      - name: Verify npm credentials before publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "$(npm --version)" = "${NPM_PUBLISH_VERSION}"
          test -n "${NODE_AUTH_TOKEN}"
          npm whoami --registry https://registry.npmjs.org
      - name: Require the PyPI credential to be present
        if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: test -n "${PYPI_API_TOKEN}"
      - name: Download validated release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ needs.security-build.outputs.release_id }}
          path: release-artifacts
      - name: Re-verify the sealed bundle bytes before publishing
        working-directory: release-artifacts
        run: sha256sum --check --strict SHA256SUMS
      - name: Mint a token for the binaries-only host
        id: artifacts-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SECURITY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_RELEASE_APP_PRIVATE_KEY }}
          owner: kaleidoswap
          repositories: swap-sdk-artifacts
          permission-contents: write
      # The archives the React Native package's postinstall falls back to while
      # the public repository has no release for this version. Their digests
      # are pinned inside the npm tarball, so this host cannot serve anything
      # the package would accept that the bundle did not seal.
      - name: Publish the native archives to the binaries-only host
        env:
          GH_TOKEN: ${{ steps.artifacts-token.outputs.token }}
          RELEASE_TAG: ${{ needs.security-build.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${ARTIFACTS_REPOSITORY}" >/dev/null 2>&1; then
            echo "${ARTIFACTS_REPOSITORY} already has ${RELEASE_TAG}; refusing to replace its assets." >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" \
            release-artifacts/android-artifacts.zip \
            release-artifacts/ios-artifacts.zip \
            --repo "${ARTIFACTS_REPOSITORY}" \
            --title "Native libraries for KaleidoSwap SDK ${RELEASE_TAG}" \
            --notes "Native archives for @kaleidorg/swap-sdk-react-native ${RELEASE_TAG#v}. Their SHA-256 digests are pinned in that package's native-artifacts.json."
          uploaded="$(gh api "repos/${ARTIFACTS_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '[.assets[] | select(.state == "uploaded") | .name] | sort | join(" ")')"
          test "${uploaded}" = "android-artifacts.zip ios-artifacts.zip"
      - name: Select the exact validated wheels
        if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
        run: |
          mkdir python-wheels
          cp release-artifacts/*.whl python-wheels/
      # The sdist is the source, so it waits for gate 2. attestations stays
      # false for the reason publish-pypi in release.yaml gives.
      - name: Publish the wheels to PyPI
        if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          attestations: false
          packages-dir: python-wheels
          password: ${{ secrets.PYPI_TOKEN }}
      # --provenance=false overrides publishConfig.provenance: npm only issues
      # provenance for public repositories, and this job holds no OIDC scope.
      # release.yaml's verify-mirror-release is the public check instead.
      - name: Publish the exact validated npm tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.security-build.outputs.version }}
        run: |
          npm publish ./release-artifacts/kaleidorg-swap-sdk-${VERSION}.tgz --access public --provenance=false
          npm publish ./release-artifacts/kaleidorg-swap-sdk-react-native-${VERSION}.tgz --access public --provenance=false

  security-verify-packages:
    name: Verify the published packages
    needs:
      - security-build
      - security-publish-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Download validated release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ needs.security-build.outputs.release_id }}
          path: release-artifacts
      - name: Download and hash-match both published npm tarballs
        run: >-
          python3 scripts/download_published_artifacts.py
          release-artifacts registry-npm
          --version "${{ needs.security-build.outputs.version }}"
          --npm
      # Every wheel and no sdist: an sdist on PyPI before gate 2 means the
      # source went out early, and that fails here.
      - name: Download and hash-match every published wheel
        if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
        run: >-
          python3 scripts/download_published_artifacts.py
          release-artifacts registry-python
          --version "${{ needs.security-build.outputs.version }}"
          --pypi
          --pypi-wheels-only
      # The public repository has no release for this version yet, so this
      # install proves postinstall's fallback to the binaries-only host.
      - name: Install the React Native package with lifecycle scripts enabled
        run: >-
          node packages/react-native/scripts/smoke-react-native-install.mjs
          --version "${{ needs.security-build.outputs.version }}"
